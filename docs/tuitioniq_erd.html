
<style>
#erd { width: 100%; overflow-x: auto; }
#erd svg { max-width: 100%; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#3C3489' : '#EEEDFE',
    primaryTextColor: dark ? '#CECBF6' : '#26215C',
    primaryBorderColor: dark ? '#7F77DD' : '#534AB7',
    secondaryColor: dark ? '#085041' : '#E1F5EE',
    tertiaryColor: dark ? '#444441' : '#F1EFE8',
  },
});
const diagram = `erDiagram
  USER {
    uuid id PK
    string auth_provider
    string auth_provider_id
    string email
    string first_name
    string last_name
    string display_name
    string avatar_url
    boolean is_active
    timestamptz created_at
    timestamptz updated_at
    timestamptz deleted_at
  }
  ORGANIZATION {
    uuid id PK
    string name
    string slug
    uuid owner_id FK
    string plan
    timestamptz plan_expires_at
    jsonb settings
    timestamptz created_at
    timestamptz updated_at
    timestamptz deleted_at
  }
  ORGANIZATION_MEMBER {
    uuid id PK
    uuid organization_id FK
    uuid user_id FK
    string role
    uuid invited_by FK
    timestamptz joined_at
    timestamptz created_at
    timestamptz updated_at
  }
  STUDENT {
    uuid id PK
    uuid organization_id FK
    uuid user_id FK
    uuid created_by FK
    string first_name
    string last_name
    string email
    string phone
    date date_of_birth
    string grade_level
    string notes
    string status
    string account_status
    jsonb metadata
    timestamptz created_at
    timestamptz updated_at
    timestamptz deleted_at
  }
  TEACHER_STUDENT {
    uuid id PK
    uuid organization_id FK
    uuid teacher_id FK
    uuid student_id FK
    timestamptz assigned_at
    uuid assigned_by FK
    boolean is_primary
    timestamptz created_at
    timestamptz updated_at
  }
  INVITE {
    uuid id PK
    uuid organization_id FK
    uuid invited_by FK
    string email
    string role
    uuid student_id FK
    string token
    string status
    uuid accepted_by FK
    timestamptz accepted_at
    timestamptz expires_at
    timestamptz created_at
    timestamptz updated_at
    timestamptz deleted_at
  }
  STUDENT_FEE {
    uuid id PK
    uuid organization_id FK
    uuid student_id FK
    uuid set_by FK
    string fee_source
    bigint manual_fee_cents
    string override_reason
    char currency
    date effective_from
    date effective_to
    boolean is_active
    string notes
    timestamptz created_at
    timestamptz updated_at
    timestamptz deleted_at
  }
  FEE_PERIOD {
    uuid id PK
    uuid organization_id FK
    uuid student_id FK
    uuid student_fee_id FK
    smallint period_year
    smallint period_month
    bigint fee_cents
    bigint amount_paid_cents
    char currency
    string status
    date due_date
    uuid waived_by FK
    timestamptz waived_at
    string waiver_reason
    string notes
    timestamptz created_at
    timestamptz updated_at
    timestamptz deleted_at
  }
  FEE_PAYMENT {
    uuid id PK
    uuid organization_id FK
    uuid student_id FK
    uuid fee_period_id FK
    uuid recorded_by FK
    bigint amount_cents
    char currency
    date payment_date
    string payment_method
    string reference
    string notes
    timestamptz created_at
    timestamptz updated_at
    timestamptz deleted_at
  }
  AUDIT_LOG {
    uuid id PK
    uuid organization_id FK
    uuid actor_id FK
    string action
    string entity_type
    uuid entity_id
    jsonb old_values
    jsonb new_values
    inet ip_address
    string user_agent
    timestamptz created_at
  }

  USER ||--o{ ORGANIZATION_MEMBER : "belongs to"
  ORGANIZATION ||--o{ ORGANIZATION_MEMBER : "has members"
  ORGANIZATION ||--|| USER : "owned by"
  ORGANIZATION ||--o{ STUDENT : "scopes"
  ORGANIZATION ||--o{ INVITE : "issues"
  ORGANIZATION ||--o{ AUDIT_LOG : "logs"
  USER ||--o{ STUDENT : "creates (created_by)"
  USER o|--o| STUDENT : "portal account"
  ORGANIZATION_MEMBER ||--o{ TEACHER_STUDENT : "teacher link"
  ORGANIZATION_MEMBER ||--o{ STUDENT_FEE : "sets fee"
  ORGANIZATION_MEMBER ||--o{ FEE_PAYMENT : "records"
  ORGANIZATION_MEMBER ||--o{ INVITE : "invites"
  STUDENT ||--o{ TEACHER_STUDENT : "assigned to"
  STUDENT ||--o{ STUDENT_FEE : "has fee config"
  STUDENT ||--o{ FEE_PERIOD : "billed in"
  STUDENT ||--o{ FEE_PAYMENT : "pays via"
  STUDENT_FEE o|--o{ FEE_PERIOD : "snapshots"
  FEE_PERIOD ||--o{ FEE_PAYMENT : "receives"
  USER ||--o{ AUDIT_LOG : "actor"
  USER ||--o{ INVITE : "accepts"
  INVITE o|--o| STUDENT : "pre-links to"
`;
const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
